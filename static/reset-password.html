<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset Password - Backend Auth Service</title>
        <style>
            :root {
                --primary-color: #4f46e5;
                --secondary-color: #818cf8;
                --dark-color: #1f2937;
                --light-color: #f9fafb;
                --error-color: #ef4444;
                --success-color: #10b981;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                line-height: 1.6;
                color: var(--dark-color);
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .auth-container {
                background: white;
                padding: 3rem;
                border-radius: 15px;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 400px;
            }

            .auth-header {
                text-align: center;
                margin-bottom: 2rem;
            }

            .auth-header h1 {
                color: var(--primary-color);
                margin-bottom: 0.5rem;
            }

            .form-group {
                margin-bottom: 1.5rem;
            }

            .form-group label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: 500;
            }

            .form-group input {
                width: 100%;
                padding: 0.75rem 1rem;
                border: 2px solid #e5e7eb;
                border-radius: 8px;
                font-size: 1rem;
                transition: border-color 0.3s;
            }

            .form-group input:focus {
                outline: none;
                border-color: var(--primary-color);
            }

            .btn {
                width: 100%;
                padding: 0.75rem;
                background-color: var(--primary-color);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                cursor: pointer;
                transition: background-color 0.3s;
            }

            .btn:hover {
                background-color: var(--secondary-color);
            }

            .btn:disabled {
                background-color: #9ca3af;
                cursor: not-allowed;
            }

            .alert {
                padding: 0.75rem;
                border-radius: 8px;
                margin-bottom: 1rem;
                display: none;
            }

            .alert.error {
                background-color: #fee2e2;
                color: var(--error-color);
                border: 1px solid #fecaca;
            }

            .alert.success {
                background-color: #d1fae5;
                color: var(--success-color);
                border: 1px solid #a7f3d0;
            }

            .auth-links {
                text-align: center;
                margin-top: 1.5rem;
            }

            .auth-links a {
                color: var(--primary-color);
                text-decoration: none;
                margin: 0 0.5rem;
            }

            .auth-links a:hover {
                text-decoration: underline;
            }

            .loading {
                display: inline-block;
                width: 20px;
                height: 20px;
                border: 3px solid rgba(255, 255, 255, .3);
                border-radius: 50%;
                border-top-color: #fff;
                animation: spin 1s ease-in-out infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .code-input {
                text-align: center;
                font-size: 1.2rem;
                letter-spacing: 0.5rem;
                font-weight: bold;
            }
        </style>
    </head>

    <body>
        <div class="auth-container">
            <div class="auth-header">
                <h1>Enter Reset Code</h1>
                <p>Check your email for the 6-digit code</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required readonly>
                </div>

                <div class="form-group">
                    <label for="code">Reset Code</label>
                    <input type="text" id="code" name="code" class="code-input" maxlength="6" required
                        placeholder="000000" pattern="[0-9]{6}">
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <span id="btnText">Reset Password</span>
                    <span id="btnLoading" class="loading" style="display: none;"></span>
                </button>
            </form>

            <div class="auth-links">
                <a href="/forgot-password.html">Resend Code</a>
                <a href="/login.html">Back to Login</a>
            </div>
        </div>

        <script>
            const resetPasswordForm = document.getElementById('resetPasswordForm');
            const alertDiv = document.getElementById('alert');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const emailInput = document.getElementById('email');
            const codeInput = document.getElementById('code');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');

            function showAlert(message, type) {
                alertDiv.textContent = message;
                alertDiv.className = `alert ${type}`;
                alertDiv.style.display = 'block';
            }

            function hideAlert() {
                alertDiv.style.display = 'none';
            }

            function setLoading(loading) {
                if (loading) {
                    submitBtn.disabled = true;
                    btnText.style.display = 'none';
                    btnLoading.style.display = 'inline-block';
                } else {
                    submitBtn.disabled = false;
                    btnText.style.display = 'inline';
                    btnLoading.style.display = 'none';
                }
            }

            // Pre-fill email from localStorage or redirect if not found
            window.addEventListener('load', () => {
                const email = localStorage.getItem('reset_email');
                if (email) {
                    emailInput.value = email;
                } else {
                    showAlert('No email found. Please start the reset process again.', 'error');
                    setTimeout(() => {
                        window.location.href = '/forgot-password.html';
                    }, 2000);
                }
            });

            // Only allow numbers in code input
            codeInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });

            resetPasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                // Validate password confirmation
                if (newPasswordInput.value !== confirmPasswordInput.value) {
                    showAlert('Passwords do not match', 'error');
                    return;
                }

                if (newPasswordInput.value.length < 6) {
                    showAlert('Password must be at least 6 characters long', 'error');
                    return;
                }

                if (codeInput.value.length !== 6) {
                    showAlert('Please enter a 6-digit code', 'error');
                    return;
                }

                setLoading(true);

                const resetData = {
                    email: emailInput.value,
                    code: codeInput.value,
                    new_password: newPasswordInput.value
                };

                try {
                    const response = await fetch('/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(resetData)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showAlert('Password reset successfully! Redirecting to login...', 'success');

                        // Clean up localStorage
                        localStorage.removeItem('reset_email');

                        // Redirect to login after 2 seconds
                        setTimeout(() => {
                            window.location.href = '/login.html';
                        }, 2000);
                    } else {
                        showAlert(result.error || 'Password reset failed', 'error');
                    }
                } catch (error) {
                    console.error('Reset password error:', error);
                    showAlert('Network error. Please try again.', 'error');
                } finally {
                    setLoading(false);
                }
            });
        </script>
    </body>

</html>
