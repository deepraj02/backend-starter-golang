<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forgot Password - Backend Auth Service</title>
        <style>
            :root {
                --primary-color: #4f46e5;
                --secondary-color: #818cf8;
                --dark-color: #1f2937;
                --light-color: #f9fafb;
                --error-color: #ef4444;
                --success-color: #10b981;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                line-height: 1.6;
                color: var(--dark-color);
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .auth-container {
                background: white;
                padding: 3rem;
                border-radius: 15px;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 400px;
            }

            .auth-header {
                text-align: center;
                margin-bottom: 2rem;
            }

            .auth-header h1 {
                color: var(--primary-color);
                margin-bottom: 0.5rem;
            }

            .form-group {
                margin-bottom: 1.5rem;
            }

            .form-group label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: 500;
            }

            .form-group input {
                width: 100%;
                padding: 0.75rem 1rem;
                border: 2px solid #e5e7eb;
                border-radius: 8px;
                font-size: 1rem;
                transition: border-color 0.3s;
            }

            .form-group input:focus {
                outline: none;
                border-color: var(--primary-color);
            }

            .btn {
                width: 100%;
                padding: 0.75rem;
                background-color: var(--primary-color);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                cursor: pointer;
                transition: background-color 0.3s;
            }

            .btn:hover {
                background-color: var(--secondary-color);
            }

            .btn:disabled {
                background-color: #9ca3af;
                cursor: not-allowed;
            }

            .alert {
                padding: 0.75rem;
                border-radius: 8px;
                margin-bottom: 1rem;
                display: none;
            }

            .alert.error {
                background-color: #fee2e2;
                color: var(--error-color);
                border: 1px solid #fecaca;
            }

            .alert.success {
                background-color: #d1fae5;
                color: var(--success-color);
                border: 1px solid #a7f3d0;
            }

            .auth-links {
                text-align: center;
                margin-top: 1.5rem;
            }

            .auth-links a {
                color: var(--primary-color);
                text-decoration: none;
                margin: 0 0.5rem;
            }

            .auth-links a:hover {
                text-decoration: underline;
            }

            .loading {
                display: inline-block;
                width: 20px;
                height: 20px;
                border: 3px solid rgba(255, 255, 255, .3);
                border-radius: 50%;
                border-top-color: #fff;
                animation: spin 1s ease-in-out infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <div class="auth-container">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter your email to receive a reset code</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <span id="btnText">Send Reset Code</span>
                    <span id="btnLoading" class="loading" style="display: none;"></span>
                </button>
            </form>

            <div class="auth-links">
                <a href="/login.html">Back to Login</a>
                <a href="/register.html">Create Account</a>
            </div>
        </div>

        <script>
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const alertDiv = document.getElementById('alert');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');

            function showAlert(message, type) {
                alertDiv.textContent = message;
                alertDiv.className = `alert ${type}`;
                alertDiv.style.display = 'block';
            }

            function hideAlert() {
                alertDiv.style.display = 'none';
            }

            function setLoading(loading) {
                if (loading) {
                    submitBtn.disabled = true;
                    btnText.style.display = 'none';
                    btnLoading.style.display = 'inline-block';
                } else {
                    submitBtn.disabled = false;
                    btnText.style.display = 'inline';
                    btnLoading.style.display = 'none';
                }
            }

            forgotPasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();
                setLoading(true);

                const formData = new FormData(forgotPasswordForm);
                const email = formData.get('email');

                try {
                    const response = await fetch('/auth/forgot-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showAlert('Reset code sent to your email!', 'success');

                        // Store email and redirect to reset password page after 2 seconds
                        localStorage.setItem('reset_email', email);
                        setTimeout(() => {
                            window.location.href = '/reset-password.html';
                        }, 2000);
                    } else {
                        showAlert(result.error || 'Failed to send reset code', 'error');
                    }
                } catch (error) {
                    console.error('Forgot password error:', error);
                    showAlert('Network error. Please try again.', 'error');
                } finally {
                    setLoading(false);
                }
            });
        </script>
    </body>

</html>
