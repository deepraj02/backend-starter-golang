<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Backend Auth Service</title>
        <style>
            :root {
                --primary-color: #4f46e5;
                --secondary-color: #818cf8;
                --dark-color: #1f2937;
                --light-color: #f9fafb;
                --success-color: #10b981;
                --error-color: #ef4444;
                --google-color: #db4437;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                line-height: 1.6;
                color: var(--dark-color);
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .container {
                background: white;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 450px;
                margin: 1rem;
            }

            h1 {
                text-align: center;
                margin-bottom: 2rem;
                color: var(--dark-color);
            }

            .form-group {
                margin-bottom: 1rem;
            }

            label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: 600;
                color: var(--dark-color);
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            textarea {
                width: 100%;
                padding: 0.75rem;
                border: 1px solid #d1d5db;
                border-radius: 5px;
                font-size: 1rem;
            }

            input[type="text"]:focus,
            input[type="email"]:focus,
            input[type="password"]:focus,
            textarea:focus {
                outline: none;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            }

            textarea {
                resize: vertical;
                min-height: 80px;
            }

            .btn {
                width: 100%;
                padding: 0.75rem;
                background-color: var(--primary-color);
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 1rem;
                cursor: pointer;
                margin-bottom: 1rem;
                font-weight: 600;
            }

            .btn:hover {
                opacity: 0.9;
            }

            .btn.google {
                background-color: rgb(28, 21, 21);
                display: flex;
                align-items: center;
                justify-content: center;

                gap: 0.5rem;
            }

            .divider {
                text-align: center;
                margin: 1.5rem 0;
                position: relative;
                color: #6b7280;
            }

            .divider::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 0;
                right: 0;
                height: 1px;
                background: #e5e7eb;
                z-index: 1;
            }

            .divider span {
                background: white;
                padding: 0 1rem;
                position: relative;
                z-index: 2;
            }

            .links {
                text-align: center;
                margin-top: 1rem;
            }

            .links a {
                color: var(--primary-color);
                text-decoration: none;
            }

            .links a:hover {
                text-decoration: underline;
            }

            .error {
                background-color: #fef2f2;
                color: var(--error-color);
                padding: 0.75rem;
                border-radius: 5px;
                margin-bottom: 1rem;
                border: 1px solid #fecaca;
            }

            .success {
                background-color: #f0fdf4;
                color: var(--success-color);
                padding: 0.75rem;
                border-radius: 5px;
                margin-bottom: 1rem;
                border: 1px solid #bbf7d0;
            }

            .google-icon {
                width: 18px;
                height: 18px;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1>Create Account</h1>

            <div id="message"></div>

            <button onclick="registerWithGoogle()" class="btn google">
                <svg class="google-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Sign in with Google
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="bio">Bio (Optional)</label>
                    <textarea id="bio" name="bio" placeholder="Tell us a bit about yourself..."></textarea>
                </div>

                <button type="submit" class="btn">Create Account</button>
            </form>

            <div class="links">
                <p>Already have an account? <a href="/login.html">Sign in</a></p>
                <p><a href="/">Back to Home</a></p>
            </div>
        </div>

        <script>
            function showMessage(message, type = 'error') {
                const messageDiv = document.getElementById('message');
                messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            }

            function registerWithGoogle() {
                window.location.href = '/auth/google';
            }

            document.getElementById('registerForm').addEventListener('submit', async function (e) {
                e.preventDefault();

                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const bio = document.getElementById('bio').value;

                try {
                    const response = await fetch('/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            email: email,
                            password: password,
                            bio: bio
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Store tokens and user data
                        localStorage.setItem('access_token', data.data.access_token);
                        localStorage.setItem('refresh_token', data.data.refresh_token);
                        localStorage.setItem('user', JSON.stringify(data.data.user));

                        // Redirect to dashboard
                        window.location.href = '/dashboard.html';
                    } else {
                        showMessage(data.error || 'Registration failed. Please try again.');
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    showMessage('Network error. Please try again.');
                }
            });
        </script>
    </body>

</html>
